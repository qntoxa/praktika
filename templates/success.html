<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запрос принят в обработку | РТ</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 500px; 
            border-top: 4px solid #eb5a00; 
        }
        h2 { color: #1a1a1a; font-weight: 400; margin-top: 0; font-size: 24px; }
        p { color: #444; line-height: 1.6; font-size: 15px; }
        .email-highlight { font-weight: bold; color: #eb5a00; }
        
        /* Фирменная оранжевая кнопка */
        .btn-close { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 12px 30px; 
            background-color: #eb5a00; 
            color: white; 
            font-size: 14px; 
            font-weight: 500; 
            border: none; 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        .btn-close:hover { background-color: #d45100; }
        
        .timer-info { 
            font-size: 12px; 
            color: #777; 
            margin-top: 20px; 
            background: #f8fafb;
            padding: 8px;
            border-radius: 4px;
        }
        #countdown { font-weight: bold; color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Заявка принята в обработку</h2>
        <p>Ваши регистрационные данные успешно получены и отправлены администратору.</p>
        <p>Сообщение о предоставлении доступа будет отправлено на ваш электронный адрес:
<span class="email-highlight">{{.}}</span></p>
        
        <!-- Кнопка для мгновенного перехода -->
        <button class="btn-close" onclick="redirectToPortal()">ОК</button>
        
        <!-- Интерактивный счетчик времени -->
        <div class="timer-info">
            Вы будете автоматически перенаправлены на главную страницу через <span id="countdown">10</span> сек.
        </div>
    </div>

    <script>
        // Целевой URL для редиректа
        const targetUrl = "https://ahd.rt.ru";
        
        // Время ожидания в секундах
        let timeLeft = 10; 

        // Функция мгновенного редиректа (для кнопки ОК)
        function redirectToPortal() {
            window.location.replace(targetUrl);
        }

        // Надежный JS-таймер обратного отсчета
        const timerElement = document.getElementById("countdown");
        
        const countdownTimer = setInterval(function() {
            timeLeft--;
            if (timerElement) {
                timerElement.textContent = timeLeft;
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                // Использование replace вместо href предотвращает зацикливание при нажатии кнопки "Назад" в браузере
                window.location.replace(targetUrl);
            }
        }, 1000); // Обновление каждую 1 секунду
    </script>
</body>
</html>
